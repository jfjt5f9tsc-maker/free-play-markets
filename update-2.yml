name: Update markets
on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour (GitHub may start runs a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: update-markets
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - name: Commit changes
        run: |
          git config user.name "markets-bot"
          git config user.email "markets-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Market update" && git pull --rebase && git push)
